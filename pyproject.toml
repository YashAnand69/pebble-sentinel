[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pebble-sentinel"
version = "0.1.0"
description = "Local runtime action guard for AI agent harnesses"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["PyYAML>=6.0,<7", "numpy>=2.0,<3", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
include = ["sentinel*"]
